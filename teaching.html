      const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

      function uid(prefix = "id") {
        return `${prefix}_${Math.random().toString(16).slice(2)}_${Date.now().toString(16)}`;
      }

      function classNames(...arr) {
        return arr.filter(Boolean).join(" ");

      function Pill({ children, tone = "slate" }) {
        const tones = {
          slate: "bg-slate-100 text-slate-700 ring-slate-200",
          blue: "bg-blue-50 text-blue-700 ring-blue-200",
          emerald: "bg-emerald-50 text-emerald-700 ring-emerald-200",
          amber: "bg-amber-50 text-amber-700 ring-amber-200",
          rose: "bg-rose-50 text-rose-700 ring-rose-200",
          violet: "bg-violet-50 text-violet-700 ring-violet-200",
        };
        return (
          <span className={classNames("inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs ring-1", tones[tone] || tones.slate)}>
            {children}
          </span>
        );

      function SectionCard({ id, title, subtitle, children, right }) {

      function CollapsibleQA({ q, a, defaultOpen = false }) {

      function MiniFlow({ steps }) {

      function RelationshipGraph({ nodes, edges, highlight }) {
        const layout = useMemo(() => {
          // 简单环形布局，避免引入复杂图形库
          const cx = 240;
          const cy = 170;
          const r = 120;
          const positions = new Map();
          nodes.forEach((n, idx) => {
            const a = (Math.PI * 2 * idx) / nodes.length - Math.PI / 2;
            positions.set(n.id, { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
          });
          return { cx, cy, r, positions };
        }, [nodes]);

        return (
          <div className="rounded-2xl border border-slate-200 bg-white p-4">
            <div className="flex items-center justify-between gap-3">
              <div className="text-sm font-semibold">对象关系图（演示版）</div>
              <div className="flex flex-wrap gap-2">
                <Pill tone="slate">点击左侧沙盘操作可触发高亮</Pill>
              </div>
            </div>
            <div className="mt-3 overflow-auto scrollbar-thin">
              <svg width="520" height="360" viewBox="0 0 520 360" className="block">
                <defs>
                  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path>
                  </marker>
                </defs>

                {edges.map((e) => {
                  const p1 = layout.positions.get(e.from);
                  const p2 = layout.positions.get(e.to);
                  const active = highlight?.edges?.includes(e.id);
                  const stroke = active ? "#2563eb" : "#94a3b8";
                  const width = active ? 2.5 : 1.5;
                  return (
                    <g key={e.id}>
                      <line
                        x1={p1.x}
                        y1={p1.y}
                        x2={p2.x}
                        y2={p2.y}
                        stroke={stroke}
                        strokeWidth={width}
                        markerEnd="url(#arrow)"
                        opacity={active ? 1 : 0.7}
                      />
                      <text x={(p1.x + p2.x) / 2} y={(p1.y + p2.y) / 2} fill={active ? "#1d4ed8" : "#64748b"} fontSize="11">
                        {e.label}
                      </text>
                    </g>
                  );
                })}

                {nodes.map((n) => {
                  const p = layout.positions.get(n.id);
                  const active = highlight?.nodes?.includes(n.id);
                  return (
                    <g key={n.id}>
                      <circle cx={p.x} cy={p.y} r={active ? 26 : 22} fill={active ? "#dbeafe" : "#f1f5f9"} stroke={active ? "#2563eb" : "#cbd5e1"} />
                      <text x={p.x} y={p.y + 4} textAnchor="middle" fill={active ? "#1e40af" : "#0f172a"} fontSize="12" fontWeight="600">
                        {n.label}
                      </text>
                    </g>
                  );
                })}
              </svg>
            </div>
          </div>
        );
      }

            quiz: [
              { q: "调拨与采购/销售最大的不同？", a: "调拨是内部流转，核心是“在途可视与差异闭环”；采购/销售是对外交易。", open: true },
              { q: "变更题：调拨单已部分发运还能改目标仓吗？", a: "已发运部分应保持原链路；未发运部分可拆单重建，否则在途与对账会混乱。", open: false },
              { q: "为什么要建在途库存？", a: "让补货/承诺/报表反映真实供给状态，并支持延误预警与异常处理。", open: false },
            ],
          },
        ];
      }

      function computeImpact({ theme, op, payload }) {
        // 根据操作类型输出影响分析（教学用）
        const impacts = [];
        const warnings = [];
        const sync = [];
        const highlight = { nodes: [], edges: [] };

        const add = (title, body, tone = "slate") => impacts.push({ title, body, tone });
        const warn = (body) => warnings.push(body);
        const syncTo = (sys, why) => sync.push({ sys, why });

        if (!theme) return { impacts, warnings, sync, highlight };

        // 根据主题提供共性规则
        if (op === "add") {
          add("你在做“新增”", "新增通常意味着：创建新的主数据值/规则版本，或创建新的批次/单据行。重点检查唯一性、上下游支持、口径计算是否需要更新。", "blue");
          warn("新增后要检查：是否会引发口径断层（OMS 可售 vs WMS 可用）？");
        } else if (op === "edit") {
          add("你在做“修改”", "修改是风险最高的操作：历史数据引用、审计可追溯性、对账口径都可能被破坏。推荐：版本化/更正记录/新增迁移。", "amber");
          warn("如果该值已被库存/单据引用，优先用“版本化/迁移”替代“原地改值”。");
        } else if (op === "del") {
          add("你在做“删除/停用”", "删除前务必做前置校验：库存是否清零、是否有未完结单据引用、是否有审计要求。多数情况下推荐软删除（停用）。", "rose");
          warn("物理删除通常会破坏历史报表/追溯/对账。");
        }

        // 主题个性化：用 nodes/edges 高亮几个关键关系
        const t = theme.id;
        if (t === "batch") {
          highlight.nodes = ["BATCH", "INV", "ASN"];
          highlight.edges = ["e3", "e4"];
          syncTo("WMS", "批次属性影响质检/冻结/FEFO 拣选策略");
          syncTo("OMS", "若 OMS 以批次可售承诺，需要同步批次口径与禁发规则");
          if (op === "edit") warn("修改批次号会断开追溯链路，建议新建批次并迁移库存。");
          add("口径提示", "批次相关库存要按（SKU+批次）维度解释“可用/可售/冻结”。", "slate");
        } else if (t === "expiry") {
          highlight.nodes = ["RULE", "BATCH", "SO"];
          highlight.edges = ["e2", "e4"];
          syncTo("WMS", "效期规则决定入库校验与 FEFO/禁发");
          syncTo("OMS", "渠道可售与临期禁发往往在 OMS 层体现");
          if (op === "edit") warn("效期规则变更建议版本化：新入库按新规则，存量按旧规则。");
          add("常见验证", "拿 1 个 SKU 跑通：入库校验→临期预警→出库禁发→报表。", "emerald");
        } else if (t === "invStatus") {
          highlight.nodes = ["STATUS", "INV", "OMS", "WMS"];
          highlight.edges = ["e1", "e4"];
          syncTo("WMS", "状态决定可分配/可出库/可盘点");
          syncTo("OMS", "状态映射影响可售口径，必须同步");
          if (op !== "add") warn("不要改枚举语义；改语义建议新增新状态并迁移。");
          add("设计建议", "状态少而稳，用原因码解释；状态变更必须有流水与审计。", "violet");
        } else if (t === "availableInv") {
          highlight.nodes = ["AVAIL", "ONHAND", "ALLOC"];
          highlight.edges = ["e1", "e3"];
          syncTo("OMS", "对外承诺用可售/可用口径，必须可解释");
          syncTo("WMS", "仓内分配用可用口径，需实时或准实时");
          if (op === "edit") warn("口径变更强烈建议版本化，并保留新旧并行期。");
          add("拆分项", "建议页面展示：在库、冻结/待检、已分配、安全库存等拆分项。", "slate");
        } else if (t === "reserved") {
          highlight.nodes = ["RES", "INV", "OMS"];
          highlight.edges = ["e1", "e2"];
          syncTo("OMS", "预占影响可售承诺与取消/超时释放");
          syncTo("WMS", "预占转波次/拣货时要校验一致性");
          warn("预占必须有 TTL + 释放兜底 + 幂等键，否则会形成“永久锁死”。");
          add("推荐指标", "预占命中率、释放延迟、预占库存占比、取消释放成功率。", "emerald");
        } else if (t === "po") {
          highlight.nodes = ["PO", "ASN", "GRN", "AP"];
          highlight.edges = ["e2", "e5"];
          syncTo("ERP", "PO 是计划与结算基准，字段归属通常在 ERP");
          syncTo("WMS", "收货差异回写 PO/供应商绩效");
          if (op === "edit") warn("价格/交期等关键字段变更应走审批与版本，避免覆盖历史。");
          add("对账建议", "以“PO 版本 + 收货结果”对账，差异结构化原因码。", "slate");
        } else if (t === "asn") {
          highlight.nodes = ["ASN", "APPT", "RCV"];
          highlight.edges = ["e2", "e3"];
          syncTo("ERP", "ASN 常由 ERP/供应商生成并回传");
          syncTo("WMS", "收货校验与质检策略依赖 ASN 明细与批次/效期");
          warn("ETA 变更是高风险：要触发预约重排与仓库排班通知。");
          add("数据质量抓手", "校验规则 + 供应商绩效绑定 + 异常原因码。", "emerald");
        } else if (t === "transfer") {
          highlight.nodes = ["TR", "TRANSIT", "IN", "OUT"];
          highlight.edges = ["e2", "e3"];
          syncTo("WMS", "调拨出库/入库与差异闭环");
          syncTo("ERP", "跨组织可能涉及内部结算/对账");
          warn("已部分发运时不要直接改单，优先拆单处理未发运部分。");
          add("关键口径", "在途库存要作为独立口径与状态，用于承诺与补货计算。", "slate");
        }

        // 把 payload 的关键信息映射成解释
        if (payload?.name) {
          add("你操作的对象", `对象名称/编号：${payload.name}`, "slate");
        }
        if (payload?.scope) {
          add("范围", `影响范围：${payload.scope}`, "slate");
        }
        if (payload?.reason) {
          add("原因/备注", payload.reason, "slate");
        }

        return { impacts, warnings, sync, highlight };
      }

      function Sandbox({ theme, onHighlight, onLog }) {
        const [op, setOp] = useState("add"); // add/edit/del
        const [payload, setPayload] = useState({ name: "", scope: "全局", reason: "" });
        const [result, setResult] = useState(null);

        useEffect(() => {
          // 主题切换时重置结果
          setResult(null);
          onHighlight?.(null);
        }, [theme?.id]);

        const run = () => {
          const r = computeImpact({ theme, op, payload });
          setResult(r);
          onHighlight?.(r.highlight);
          onLog?.({
            id: uid("evt"),
            time: new Date().toLocaleString(),
            themeId: theme?.id,
            themeName: theme?.name,
            op,
            payload,
            summary: `${opLabel(op)}：${payload.name || "(未命名)"}（${payload.scope}）`,

        return (
          <div className="rounded-2xl border border-slate-200 bg-white shadow-sm">
            <div className="flex flex-col gap-3 border-b border-slate-100 px-5 py-4 lg:flex-row lg:items-center lg:justify-between">
              <div>
                <div className="text-base font-semibold tracking-tight">模拟操作沙盘</div>
                <div className="mt-1 text-sm text-slate-600">选择一个操作（新增/修改/删除），填写信息后执行，页面会动态给出影响分析，并高亮关系图关键对象。</div>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <Pill tone="slate">主题：{theme?.name || "未选择"}</Pill>
                <Pill tone={op === "add" ? "blue" : op === "edit" ? "amber" : "rose"}>操作：{opLabel(op)}</Pill>
              </div>
            </div>

            <div className="px-5 py-4">
              <div className="grid gap-3 lg:grid-cols-12">
                <div className="lg:col-span-3">
                  <div className="text-xs font-medium text-slate-500">操作类型</div>
                  <div className="mt-2 grid grid-cols-3 gap-2 lg:grid-cols-1">
                    {[
                      { k: "add", label: "新增", tone: "blue" },
                      { k: "edit", label: "修改", tone: "amber" },
                      { k: "del", label: "删除/停用", tone: "rose" },
                    ].map((x) => (
                      <button
                        key={x.k}
                        type="button"
                        onClick={() => setOp(x.k)}
                        className={classNames(
                          "rounded-xl border px-3 py-2 text-left text-sm transition",

                        )}
                      >
                        <div className="flex items-center justify-between">
                          <span className="font-medium">{x.label}</span>
                          <span className={classNames("h-2 w-2 rounded-full", x.k === "add" ? "bg-blue-400" : x.k === "edit" ? "bg-amber-400" : "bg-rose-400")} />
                        </div>
                        <div className={classNames("mt-1 text-xs", op === x.k ? "text-slate-200" : "text-slate-500")}>
                          {x.k === "add" ? "创建新值/新规则/新批次" : x.k === "edit" ? "更改现有值（高风险）" : "停用/取消（推荐软删）"}
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="lg:col-span-5">
                  <div className="grid gap-3">
                    <div>
                      <div className="text-xs font-medium text-slate-500">对象名称/编号</div>
                      <input
                        value={payload.name}
                        onChange={(e) => setPayload((p) => ({ ...p, name: e.target.value }))}
                        placeholder={theme?.id === "batch" ? "例如：BATCH-20260430-A01" : theme?.id === "po" ? "例如：PO-240430-001" : "例如：规则V2 / 状态-待检 / 调拨单-TR001"}
                        className="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none ring-0 focus:border-slate-400"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <div className="text-xs font-medium text-slate-500">影响范围</div>
                        <select
                          value={payload.scope}
                          onChange={(e) => setPayload((p) => ({ ...p, scope: e.target.value }))}
                          className="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
                        >
                          {["全局", "单仓", "单渠道", "单SKU", "单批次/效期", "单供应商", "单调拨链路"].map((x) => (
                            <option key={x} value={x}>
                              {x}
                            </option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <div className="text-xs font-medium text-slate-500">常用提示</div>
                        <div className="mt-2 flex flex-wrap gap-2">
                          <Pill tone="slate">先检查</Pill>
                          <Pill tone="amber">再变更</Pill>
                          <Pill tone="emerald">留痕审计</Pill>
                        </div>
                      </div>
                    </div>
                    <div>
                      <div className="text-xs font-medium text-slate-500">原因/备注（用于课堂讲解）</div>
                      <textarea
                        value={payload.reason}
                        onChange={(e) => setPayload((p) => ({ ...p, reason: e.target.value }))}
                        placeholder="例如：供应商改批次规则；临期策略调整；新增状态用于隔离待检库存…"
                        rows="3"
                        className="mt-2 w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
                      ></textarea>
                    </div>
                    <div className="flex flex-wrap items-center gap-2">
                      <button
                        type="button"
                        onClick={run}
                        className="rounded-xl bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-slate-800"
                      >
                        执行并分析影响
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setPayload({ name: "", scope: "全局", reason: "" });
                          setResult(null);
                          onHighlight?.(null);
                        }}
                        className="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
                      >
                        重置
                      </button>
                      <div className="text-xs text-slate-500">提示：为了演示，建议你先点一次“修改”。</div>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-4">
                  <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4">
                    <div className="text-sm font-semibold text-slate-900">影响分析（动态）</div>
                    {!result ? (
                      <div className="mt-2 text-sm leading-relaxed text-slate-600">
                        还没有执行操作。执行后这里会显示：
                        <ul className="mt-2 space-y-1">
                          {["检查清单", "受影响对象与口径", "需要同步的系统", "禁忌做法与风险提示"].map((x) => (
                            <li key={x} className="flex gap-2">
                              <span className="mt-2 h-1.5 w-1.5 rounded-full bg-slate-300"></span>
                              <span>{x}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    ) : (
                      <div className="mt-3 space-y-3">
                        <div className="space-y-2">
                          {result.impacts.map((it) => (
                            <div key={it.title} className="rounded-xl border border-slate-200 bg-white px-3 py-2">
                              <div className="flex items-center justify-between gap-2">
                                <div className="text-sm font-semibold">{it.title}</div>
                                <Pill tone={it.tone}>{toneLabel(it.tone)}</Pill>
                              </div>
                              <div className="mt-1 text-sm leading-relaxed text-slate-700">{it.body}</div>
                            </div>
                          ))}
                        </div>

                        {result.sync?.length ? (
                          <div className="rounded-xl border border-slate-200 bg-white px-3 py-2">
                            <div className="text-sm font-semibold">需要同步/联动的系统</div>
                            <div className="mt-2 space-y-2">
                              {result.sync.map((s, idx) => (
                                <div key={`${s.sys}_${idx}`} className="flex items-start gap-2 text-sm">
                                  <Pill tone="violet">{s.sys}</Pill>
                                  <div className="text-slate-700">{s.why}</div>
                                </div>
                              ))}
                            </div>
                          </div>
                        ) : null}

                        {result.warnings?.length ? (
                          <div className="rounded-xl border border-rose-200 bg-rose-50 px-3 py-2">
                            <div className="text-sm font-semibold text-rose-900">风险提示</div>
                            <ul className="mt-2 space-y-1 text-sm text-rose-800">
                              {result.warnings.map((w) => (
                                <li key={w} className="flex gap-2">
                                  <span className="mt-2 h-1.5 w-1.5 rounded-full bg-rose-300"></span>
                                  <span>{w}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        ) : null}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function opLabel(op) {
        if (op === "add") return "新增";
        if (op === "edit") return "修改";
        return "删除/停用";
      }

      function toneLabel(tone) {
        if (tone === "blue") return "建议";
        if (tone === "amber") return "高风险";
        if (tone === "rose") return "强提醒";
        if (tone === "emerald") return "实践";
        if (tone === "violet") return "设计";
        return "说明";
      }

      function DecisionFramework({ items, boundary }) {

                    <div className="rounded-xl border border-emerald-200 bg-emerald-50 p-3">
                      <div className="font-semibold text-emerald-900">是</div>

            </div>

                    <Pill tone="slate">单文件：teaching.html</Pill>

                  </div>
                  <div className="mt-1 text-xs text-slate-600">
                    提示：左侧切换主题；顶部沙盘执行“新增/修改/删除”后会高亮关系图并输出影响分析；下方有完整章节与小测验。
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={() => {
                      setHighlight(null);
                      setEvents([]);
                      localStorage.removeItem("teaching_events");
                      localStorage.removeItem("teaching_theme");
                    }}
                    className="hidden rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 sm:block"
                  >
                    清空本地记录
                  </button>
                </div>
              </div>
            </header>

            <main className="mx-auto grid max-w-7xl gap-4 px-4 py-4 lg:grid-cols-12">
              {/* Left */}
              <aside className="lg:col-span-3">
                <div className="sticky top-[72px] space-y-3">
                  <div className="rounded-2xl border border-slate-200 bg-white shadow-sm">
                    <div className="border-b border-slate-100 px-4 py-3">
                      <div className="text-sm font-semibold">主题</div>
                      <div className="mt-1 text-xs text-slate-600">覆盖多个常见概念；内容为通用教学示例，可后续替换为你的口径。</div>
                    </div>
                    <div className="max-h-[280px] overflow-auto px-3 py-3 scrollbar-thin">
                      <div className="space-y-2">
                        {themes.map((t) => (
                          <button
                            key={t.id}
                            type="button"
                            onClick={() => {
                              setThemeId(t.id);
                              setHighlight(null);
                              // 主题切换后滚动到顶部沙盘
                              window.scrollTo({ top: 0, behavior: "smooth" });
                            }}
                            className={classNames(
                              "w-full rounded-2xl border px-3 py-2 text-left transition",
                              themeId === t.id ? "border-slate-900 bg-slate-900 text-white" : "border-slate-200 bg-white hover:bg-slate-50"
                            )}
                          >
                            <div className="flex items-center justify-between gap-2">
                              <div className="text-sm font-semibold">{t.name}</div>
                              <span className={classNames("text-xs", themeId === t.id ? "text-slate-200" : "text-slate-500")}>{t.tag}</span>
                            </div>
                            <div className={classNames("mt-1 line-clamp-2 text-xs leading-relaxed", themeId === t.id ? "text-slate-200" : "text-slate-600")}>
                              {t.introCase}
                            </div>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="rounded-2xl border border-slate-200 bg-white shadow-sm">
                    <div className="border-b border-slate-100 px-4 py-3">
                      <div className="text-sm font-semibold">目录</div>
                      <div className="mt-1 text-xs text-slate-600">点击快速跳转章节（适合讲解时控节奏）。</div>
                    </div>
                    <div className="px-3 py-3">
                      <div className="grid gap-2">
                        {SECTIONS.map((s) => (
                          <button
                            key={s.id}
                            type="button"
                            onClick={() => jump(s.id)}
                            className="rounded-xl border border-slate-200 bg-white px-3 py-2 text-left text-sm hover:bg-slate-50"
                          >
                            {s.name}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="rounded-2xl border border-slate-200 bg-slate-900 text-white shadow-sm">
                    <div className="px-4 py-3">
                      <div className="text-sm font-semibold">讲解建议</div>
                      <ul className="mt-2 space-y-1 text-sm text-slate-200">
                        {[
                          "先讲一个贯穿案例，再讲定义与反例。",
                          "用“沙盘修改”引出变更管理与灾难故事。",
                          "强调：对象、字段、口径、同步点。",
                          "最后用小测验收尾。",
                        ].map((x) => (
                          <li key={x} className="flex gap-2">
                            <span className="mt-2 h-1.5 w-1.5 rounded-full bg-slate-400"></span>
                            <span>{x}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                </div>
              </aside>

              {/* Right */}
              <div className="space-y-4 lg:col-span-9" ref={rightRef}>
                <Sandbox theme={theme} onHighlight={setHighlight} onLog={onLog} />

                <div className="grid gap-4 lg:grid-cols-2">
                  <RelationshipGraph nodes={theme.objects} edges={theme.relations} highlight={highlight} />
                  <EventLog items={events} onClear={() => setEvents([])} />
                </div>

                <SectionCard
                  id="scene"
                  title="1. 场景引入"
                  subtitle="用一个具体案例贯穿讲解，让学员先有“痛感”。"
                  right={<Pill tone="emerald">贯穿案例</Pill>}
                >
                  <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm leading-relaxed text-slate-700">
                    {theme.introCase}
                  </div>
                  <div className="mt-3 grid gap-3 lg:grid-cols-3">
                    {[
                      { k: "学员常见误区", v: "把概念当定义背下来，但不知道在系统里怎么用、改了会怎样。", tone: "amber" },
                      { k: "讲解目标", v: "让你能说清：解决什么问题、对象/字段是什么、上下游怎么用、变更怎么做。", tone: "blue" },
                      { k: "课堂演示点", v: "上方沙盘随便做一次“修改”，就能把变更风险讲透。", tone: "emerald" },
                    ].map((x) => (
                      <div key={x.k} className="rounded-2xl border border-slate-200 bg-white p-4">
                        <div className="flex items-center justify-between">
                          <div className="text-sm font-semibold">{x.k}</div>
                          <Pill tone={x.tone}>{x.k.includes("误区") ? "高频" : "重点"}</Pill>
                        </div>
                        <div className="mt-2 text-sm leading-relaxed text-slate-700">{x.v}</div>
                      </div>
                    ))}
                  </div>
                </SectionCard>

                <SectionCard
                  id="concept"
                  title="2. 概念拆解"
                  subtitle="讲清楚：是什么 / 不是什么 / 解决什么问题 / 对应什么对象 / 关键字段 / 上下游关联。"
                  right={<Pill tone="violet">产品经理视角</Pill>}
                >
                  <div className="grid gap-3 lg:grid-cols-2">
                    <div className="rounded-2xl border border-slate-200 bg-white p-4">
                      <div className="flex items-center justify-between">
                        <div className="text-sm font-semibold">是什么</div>
                        <Pill tone="blue">定义+价值</Pill>
                      </div>
                      <div className="mt-2 text-sm leading-relaxed text-slate-700">{theme.whatIs}</div>
                    </div>
                    <div className="rounded-2xl border border-slate-200 bg-white p-4">
                      <div className="flex items-center justify-between">
                        <div className="text-sm font-semibold">不是什么</div>
                        <Pill tone="rose">避坑</Pill>
                      </div>
                      <div className="mt-2 text-sm leading-relaxed text-slate-700">{theme.whatNot}</div>
                    </div>
                  </div>

                  <div className="mt-3 rounded-2xl border border-rose-200 bg-rose-50 p-4">
                    <div className="flex items-center justify-between gap-3">
                      <div className="text-sm font-semibold text-rose-900">{theme.antiCase.title}</div>
                      <Pill tone="rose">反面案例</Pill>
                    </div>
                    <div className="mt-2 text-sm leading-relaxed text-rose-800">{theme.antiCase.body}</div>
                  </div>

                  <div className="mt-3">
                    <div className="mb-2 flex items-center justify-between">
                      <div className="text-sm font-semibold">关键字段（示例）</div>
                      <div className="flex flex-wrap gap-2">
                        <Pill tone="violet">字段归属</Pill>
                        <Pill tone="amber">约束</Pill>
                        <Pill tone="emerald">作业引用</Pill>
                      </div>
                    </div>
                    <KeyValueTable rows={theme.keyFields} />
                  </div>
                </SectionCard>

                <SectionCard
                  id="create"
                  title="3. 创建流程"
                  subtitle="按“先创建什么→再维护什么→字段来源/必填/系统生成→后续被哪些单据/库存/报表使用”讲清楚。"
                  right={<Pill tone="emerald">流程卡片</Pill>}
                >
                  <MiniFlow steps={theme.createFlow} />
                </SectionCard>

                <SectionCard
                  id="change"
                  title="4. 变更管理（重点）"
                  subtitle="新增/修改/删除：变更前检查、变更后同步、推荐流程与禁忌做法；并包含“变更引发的灾难”故事。"
                  right={<Pill tone="amber">高频翻车点</Pill>}
                >
                  <div className="grid gap-3 lg:grid-cols-3">
                    {[
                      { k: "add", title: "新增", tone: "blue" },
                      { k: "edit", title: "修改", tone: "amber" },
                      { k: "del", title: "删除/停用", tone: "rose" },
                    ].map((x) => {
                      const r = theme.changeRules[x.k];
                      return (
                        <div key={x.k} className="rounded-2xl border border-slate-200 bg-white p-4">
                          <div className="flex items-center justify-between">
                            <div className="text-sm font-semibold">{x.title}</div>
                            <Pill tone={x.tone}>{x.title}</Pill>
                          </div>
                          <div className="mt-3 text-xs font-medium text-slate-500">变更前检查</div>
                          <ul className="mt-2 space-y-1 text-sm text-slate-700">
                            {r.checks.map((c) => (
                              <li key={c} className="flex gap-2">
                                <span className="mt-2 h-1.5 w-1.5 rounded-full bg-slate-300"></span>
                                <span>{c}</span>
                              </li>
                            ))}
                          </ul>
                          <div className="mt-3 text-xs font-medium text-slate-500">推荐流程</div>
                          <ol className="mt-2 space-y-1 text-sm text-slate-700">
                            {r.flow.map((c, idx) => (
                              <li key={`${c}_${idx}`} className="flex gap-2">
                                <span className="mt-0.5 inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-slate-100 text-xs font-semibold text-slate-700">
                                  {idx + 1}
                                </span>
                                <span>{c}</span>
                              </li>
                            ))}
                          </ol>
                          <div className="mt-3 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-800">
                            <span className="font-semibold">禁忌：</span>
                            {r.taboo}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="mt-3 rounded-2xl border border-slate-200 bg-slate-900 p-4 text-white">
                    <div className="flex items-center justify-between gap-3">
                      <div className="text-sm font-semibold">变更引发的灾难（故事）</div>
                      <Pill tone="rose">警示</Pill>
                    </div>
                    <div className="mt-2 text-sm leading-relaxed text-slate-200">{theme.changeRules.disaster}</div>
                  </div>
                </SectionCard>

                <SectionCard
                  id="decision"
                  title="5. 设计边界 / 使用决策"
                  subtitle="给学员一个判断框架：什么时候该用、什么时候不该用；避免“为了精细而精细”。"
                  right={<Pill tone="violet">判断框架</Pill>}
                >
                  <DecisionFramework items={theme.decision.framework} boundary={theme.decision.boundary} />
                </SectionCard>

                <SectionCard
                  id="usage"
                  title="6. 使用场景"
                  subtitle="至少 3 个业务场景，演示这个概念在主数据/单据/作业/库存/报表中的实际用法。"
                  right={<Pill tone="emerald">演示</Pill>}
                >
                  <div className="grid gap-3 lg:grid-cols-3">
                    {theme.usageScenarios.map((s) => (
                      <div key={s.title} className="rounded-2xl border border-slate-200 bg-white p-4">
                        <div className="flex items-center justify-between">
                          <div className="text-sm font-semibold">{s.title}</div>
                          <Pill tone="slate">场景</Pill>
                        </div>
                        <div className="mt-2 text-sm leading-relaxed text-slate-700">{s.body}</div>
                      </div>
                    ))}
                  </div>
                </SectionCard>

                <SectionCard
                  id="graph"
                  title="7. 关系图"
                  subtitle="这个概念与上下游对象的关系、数据沉淀点，以及哪些系统读写它。"
                  right={<Pill tone="blue">结构化</Pill>}
                >
                  <div className="grid gap-3 lg:grid-cols-2">
                    <div className="rounded-2xl border border-slate-200 bg-white p-4">
                      <div className="text-sm font-semibold">对象关系（摘要）</div>
                      <div className="mt-2 flex flex-wrap gap-2">
                        {theme.objects.map((n) => (
                          <Pill key={n.id} tone={highlight?.nodes?.includes(n.id) ? "blue" : "slate"}>
                            {n.label}
                          </Pill>
                        ))}
                      </div>
                      <div className="mt-3 text-sm text-slate-700">
                        <span className="font-semibold">讲解技巧：</span>先说“谁是主角（本概念）”，再说“谁产生它、谁引用它、最终沉淀在哪个台账/流水”。
                      </div>
                    </div>
                    <div className="rounded-2xl border border-slate-200 bg-white p-4">
                      <div className="text-sm font-semibold">读写系统（通用示例）</div>
                      <div className="mt-2 grid gap-2">
                        {SYSTEMS.map((s) => (
                          <div key={s.key} className="flex items-start gap-3 rounded-xl border border-slate-200 bg-slate-50 p-3">
                            <Pill tone="violet">{s.label}</Pill>
                            <div className="text-sm text-slate-700">
                              {s.key === "ERP"
                                ? "偏主数据与计划/结算（如 PO/规则/价格/供应商）。"
                                : s.key === "WMS"
                                ? "偏作业执行与库存台账（收货/质检/上架/拣货/出库）。"
                                : "偏销售承诺与履约（可售口径、订单分配、渠道限制）。"}
                            </div>
                          </div>
                        ))}
                      </div>
                      <div className="mt-3 text-xs text-slate-500">注：不同公司主从系统不同，这里用于教学示例。实际口径建议做一张“字段归属表”。</div>
                    </div>
                  </div>
                </SectionCard>

                <SectionCard
                  id="pains"
                  title="8. 常见痛点"
                  subtitle="从产品设计角度总结常见问题，并给出建议（尤其关注口径与变更）。"
                  right={<Pill tone="amber">经验</Pill>}
                >
                  <div className="grid gap-3 lg:grid-cols-3">
                    {theme.pains.map((p) => (
                      <div key={p.title} className="rounded-2xl border border-slate-200 bg-white p-4">
                        <div className="text-sm font-semibold">{p.title}</div>
                        <div className="mt-2 text-sm leading-relaxed text-slate-700">{p.body}</div>
                      </div>
                    ))}
                  </div>
                </SectionCard>

                <SectionCard
                  id="quiz"
                  title="9. 小测验"
                  subtitle="3-5 题，点击展开答案；至少包含 1 道关于变更场景的题目。"
                  right={<Pill tone="emerald">互动</Pill>}
                >
                  <div className="space-y-3">
                    {theme.quiz.map((q) => (
                      <CollapsibleQA key={q.q} q={q.q} a={q.a} defaultOpen={q.open} />
                    ))}
                  </div>
                </SectionCard>

                <footer className="pb-10 pt-4 text-center text-xs text-slate-500">
                  <div>本页为教学演示原型（单文件）。如需替换为你们公司口径：把各主题的数据替换为你们字段/对象/流程即可。</div>
                </footer>
              </div>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
